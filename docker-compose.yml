version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: badminton-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-badminton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-badminton}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - badminton-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-badminton}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_USERNAME}/badminton-backend:${BACKEND_VERSION:-latest}
    container_name: badminton-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-badminton}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-badminton}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-badminton}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-badminton}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: ${FRONTEND_URL}
      CORS_CREDENTIALS: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - badminton-network
    ports:
      - "3001:3001"

  frontend:
    image: ${DOCKER_REGISTRY:-docker.io}/${DOCKER_USERNAME}/badminton-frontend:${FRONTEND_VERSION:-latest}
    container_name: badminton-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL}
      NEXT_PUBLIC_WS_URL: ${WS_URL}
    networks:
      - badminton-network
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: badminton-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - badminton-network

volumes:
  postgres_data:

networks:
  badminton-network:
    driver: bridge
